name: CortexCloud CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cortexcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cortexcloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: cortexcloud_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/cortexcloud_test
      DATA_ENABLED: "false"
      X402_ENABLED: "true"
      WALLET_ADDRESS: "0x1111111111111111111111111111111111111111"
      ALCHEMY_API_KEY: ci-test-key
      HELIUS_API_KEY: ""
      HELIUS_VERIFIED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify database migrations
        run: alembic upgrade head
      - name: Run test suite
        run: python -m pytest tests/ -q
