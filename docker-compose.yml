services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cortexcloud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cortexcloud}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-init:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "deploy/db_init.py"]
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      PORT: "${MCP_PORT:-3100}"
      CORTEXCLOUD_BASE: "${CORTEXCLOUD_BASE:-https://api.cortexcloud.org}"
      CORTEXCLOUD_PAYTO: "${CORTEXCLOUD_PAYTO:-}"
      EVM_PRIVATE_KEY: "${EVM_PRIVATE_KEY:-}"
    ports:
      - "${MCP_PORT:-3100}:3100"
    restart: unless-stopped

volumes:
  pgdata:
