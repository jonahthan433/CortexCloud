version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cortexcloud-db
    restart: always
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cortexcloud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cortexcloud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# No Redis: the Optimization Network keeps jobs, payments, usage and
# benchmarks in PostgreSQL only. Deploy via systemd (cortexcloud.service);
# `docker compose up -d db` is only for a fresh local database.